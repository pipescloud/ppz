<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ppz — {{.Org.Name}} / {{.Handle}} terminal</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/xterm.css">
  <style>
    /* Let xterm.js own its dimensions: cols×rows from the pty.stdctrl
       resize event determines width/height. inline-block so the container
       shrinks to the canvas size, then a viewport-wide flex wrapper
       centers it — without this the terminal anchors to main's left
       edge and overflows right on wide screens. */
    .terminal-wrap {
      display: flex;
      justify-content: center;
      padding: 0 1rem 2rem;
    }
    #terminal { display: inline-block; }
    .terminal-status {
      font: 12px/1.4 monospace;
      padding: 4px 0;
      max-width: 960px;
      margin: 0 auto;
    }
    .terminal-status.ok  { color: #4a4; }
    .terminal-status.err { color: #c44; }
    .terminal-control {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      max-width: 960px;
      margin: 0 auto 0.5rem;
      font: 12px/1.4 monospace;
    }
    .terminal-control[hidden] { display: none; }
    .terminal-control button { padding: 0.25rem 0.75rem; font-size: 12px; }
    .terminal-control-state { color: var(--muted); }
    .terminal-control-state.mine { color: var(--online); }
    .terminal-control-state.err { color: #c44; }
    /* Outline the terminal while your keystrokes are live. */
    #terminal.controlling { outline: 2px solid var(--online); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <header class="brand">
      <h1>
        <a href="/dashboard">ppz</a> /
        <a href="/orgs/{{.Org.Name}}">{{.Org.Name}}</a> /
        <code>{{.Handle}}</code> /
        terminal
      </h1>
      <div class="crumbs">
        live view of <code>{{.Handle}}.stdout</code> — replays retained
        bytes, then follows new writes until the page is closed. If you can
        write <code>{{.Handle}}.stdin</code>, <em>Take control</em> sends your
        keystrokes to the terminal (one controller at a time).
      </div>
    </header>
  </main>

  <div id="terminal-status" class="terminal-status">connecting…</div>
  <div class="terminal-control" data-terminal-control hidden>
    <button type="button" data-control-toggle>Take control</button>
    <span data-control-state class="terminal-control-state"></span>
  </div>

  <!-- Terminal sits OUTSIDE <main> so it isn't capped at main's
       max-width: 960px. Its flex wrapper spans the full viewport and
       centers the inline-block canvas, so a 180-col pty on a 2560px
       monitor gets equal padding on both sides instead of overflowing
       right. -->
  <div class="terminal-wrap">
    <div id="terminal" data-ws-path="/orgs/{{.Org.Name}}/sources/{{.Handle}}/terminal/ws"></div>
  </div>

  <script src="/assets/xterm.js"></script>
  <script src="/assets/terminal.js"></script>
</body>
</html>
