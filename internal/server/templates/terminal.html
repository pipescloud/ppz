<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ppz — {{.Org.Name}} / {{.Handle}} terminal</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/xterm.css">
  <style>
    /* One compact line of breadcrumbs, then the terminal with its toolbar
       attached. The terminal sizes itself (cols×rows from the pty's
       stdctrl resize events); .term-shell shrink-wraps it and the toolbar
       stretches to the same width, centred in the viewport. */
    .term-header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }
    .term-header a { color: var(--accent); text-decoration: none; }
    .term-header a:hover { color: var(--accent-hover); }
    .term-header .here { color: var(--text); }
    .term-wrap { display: flex; justify-content: center; padding: 1rem 1rem 2rem; }
    .term-shell { display: inline-flex; flex-direction: column; min-width: min(640px, 100%); }
    .term-toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem 0.9rem;
      padding: 0.4rem 0.6rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom: 0;
      border-radius: 6px 6px 0 0;
      font: 12px/1.4 Menlo, Monaco, "Courier New", monospace;
    }
    .term-conn { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--muted); }
    .term-conn::before {
      content: "";
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--offline);
    }
    .term-conn[data-state="live"] { color: var(--text); }
    .term-conn[data-state="live"]::before { background: var(--online); }
    .term-conn[data-state="error"]::before { background: #c44; }
    .term-control-state { color: var(--muted); }
    .term-control-state.mine { color: var(--online); }
    .term-control-state.err { color: #f0857d; }
    .term-spacer { flex: 1 1 auto; }
    .term-toolbar button { padding: 0.2rem 0.65rem; font-size: 12px; }
    .term-toolbar button[hidden] { display: none; }
    .term-toolbar .btn-plain { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .term-toolbar .btn-plain:hover { color: var(--text); background: var(--row-hover); }
    #terminal {
      border: 1px solid var(--border);
      border-radius: 0 0 6px 6px;
      overflow: hidden;
    }
    /* Outline the terminal while your keystrokes are live. */
    #terminal.controlling { border-color: var(--online); box-shadow: 0 0 0 1px var(--online); }
  </style>
</head>
<body>
  <header class="term-header">
    <span><a href="/dashboard">ppz</a> / <a href="/orgs/{{.Org.Name}}">{{.Org.Name}}</a> / <code>{{.Handle}}</code> / <span class="here">terminal</span></span>
  </header>

  <div class="term-wrap">
    <div class="term-shell">
      <div class="term-toolbar" data-terminal-toolbar
           title="Live view of {{.Handle}}.stdout. With write access to {{.Handle}}.stdin you can take control (one controller at a time); with write access to {{.Handle}}.stdctrl you can resize it.">
        <span id="terminal-status" class="term-conn" data-state="connecting">connecting…</span>
        <span data-control-state class="term-control-state"></span>
        <span class="term-spacer"></span>
        <button type="button" class="btn-plain" data-fit hidden
                title="Resize the terminal to fit this window">Fit to window</button>
        <button type="button" data-control-toggle hidden>Take control</button>
      </div>
      <div id="terminal" data-ws-path="/orgs/{{.Org.Name}}/sources/{{.Handle}}/terminal/ws"></div>
    </div>
  </div>

  <script src="/assets/xterm.js"></script>
  <script src="/assets/terminal.js"></script>
</body>
</html>
